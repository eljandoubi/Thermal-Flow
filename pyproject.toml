[project]
name = "thermal-flow"
version = "0.1.0"
description = "Few-shot RGB-to-Thermal domain adaptation using lightweight conditional Flow Matching"
authors = [
    { name = "eljandoubi_a", email = "abdelkarim.eljandoubi@lcl.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=thermal_flow --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
