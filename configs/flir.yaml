# Full-supervision training on FLIR ADAS.
# Prepare the raw download into root/<split>/{rgb,thermal}/<name>.jpg first
# (see thermal_flow.datasets.flir.FLIRDataset).
dataset:
  root: data/flir
  image_size: 256
  rgb_channels: 3
  thermal_channels: 3

model:
  base_channels: 96
  time_dim: 128

optimizer:
  lr: 1.0e-4
  weight_decay: 0.0

loss:
  lambda_ssim: 0.1
  lambda_edge: 0.05

# Weights & Biases tracking is off by default; flip enabled: true (and `uv run
# wandb login` once) to log train/loss curves and hyperparameters per run.
wandb:
  enabled: false
  project: thermal-flow
  mode: online

batch_size: 8
num_epochs: 100
num_workers: 4
checkpoint_dir: checkpoints/flir
